image: node:lts

variables:
  CACHE_PATH: ".npm"

cache:
  paths:
    - $CACHE_PATH/

stages:
  - install
  - lint
  - test
  - build


# - - - INSTALL - - -
install-dependencies:
  stage: install
  script: 
    - echo "Installing dependencies..."
    - npm install
  cache:
    paths:
      - $CACHE_PATH/


# - - - TEST - - -
test-unit:
  stage: test
  script:
    - echo "Running unit tests..."
    - npm run test:unit
  rules:
    - if: $CI_COMMIT_BRANCH =~ /feature\/.*/
    - if: $CI_COMMIT_BRANCH == "main"

test-integration:
  stage: test
  script:
    - echo "Running integration tests..."
    - npm run test:integration
  rules:
    - if: $CI_COMMIT_BRANCH == "main"


# - - - BUILD - - -
build:
  stage: build
  script:
    - echo "Building the project..."
    - npm run build
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
