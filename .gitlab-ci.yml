image: node:lts

stages:
    - install
    - test
    - build

# - - - INSTALL - - -
install-dependencies:
    stage: install
    script:
        - echo "Installing dependencies..."
        - apt-get update && apt-get install -y gettext
        - envsubst < .env.template > .env.local
        - npm ci
    cache:
        paths:
            - node_modules/
    artifacts:
        expire_in: 1 days
        when: on_success
        paths:
            - node_modules/
            - .env.local

# - - - TEST - - -
test-unit:
    stage: test
    needs:
        - install-dependencies
    script:
        - echo "Running unit tests..."
        - npm run test:unit
    rules:
        - if: $CI_COMMIT_BRANCH =~ /feature\/.*/
        - if: $CI_COMMIT_BRANCH == "main"

test-integration:
    stage: test
    needs:
        - install-dependencies
    services:
        - docker:dind  # Use Docker-in-Docker to run PostgreSQL in docker-compose
    variables:
        DOCKER_TLS_CERTDIR: ""  # Disable TLS for Docker-in-Docker
    before_script:

        - echo "Installing docker-compose..."
        - apt-get update && apt-get install -y docker-compose-plugin

        - echo "Starting PostgreSQL using Docker Compose..."
        - docker-compose --env-file .env.local up -d

        - echo "Waiting for PostgreSQL to be ready..."
        - until docker exec $(docker ps -qf "name=postgres") pg_isready -U $DB_USER -h $DB_HOSTNAME -p $DB_PORT; do
            echo "PostgreSQL not ready yet...";
            sleep 2;
          done
        - echo "PostgreSQL is ready!"

        - echo "Applying database schema with Drizzle..."
        - npx drizzle-kit push

    script:
        - echo "Running integration tests..."
        - npm run test:integration -- --ci --reporters=default --reporters=jest-junit

    after_script:
        - echo "Stopping PostgreSQL..."
        - docker-compose down


    rules:
        - if: $CI_COMMIT_BRANCH =~ /feature\/.*/
        - if: $CI_COMMIT_BRANCH == "main"

# - - - BUILD - - -
build:
    stage: build
    needs:
        - test-integration
    script:
        - echo "Building the project..."
        - npm run build
    rules:
        - if: $CI_COMMIT_BRANCH == "main"
