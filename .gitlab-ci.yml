image: node:lts

stages:
  - install
  - lint
  - test
  - build

variables:
  CACHE_PATH: "node_modules"

# - - - INSTALL - - -
install-dependencies:
  stage: install
  script: 
    - echo "Installing dependencies..."
    - echo "${CLERK_SIGN_UP_URL}"
    - npm install
  cache:
    paths:
      - $CACHE_PATH/


# - - - TEST - - -
test-unit:
  stage: test
  script:
    - echo "Running unit tests..."
    - npm run test:unit
  artifacts:
    when: always
    reports:
      junit:
        - junit.xml
  rules:
    - if: $CI_COMMIT_BRANCH =~ /feature\/.*/
    - if: $CI_COMMIT_BRANCH == "main"

test-integration:
  stage: test
  script:
    - echo "Running integration tests..."
    - npm run test:integration
  rules:
    - if: $CI_COMMIT_BRANCH == "main"


# - - - BUILD - - -
build:
  stage: build
  script:
    - echo "Building the project..."
    - npm run build
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
