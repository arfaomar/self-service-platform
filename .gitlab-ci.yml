image: node:lts

stages:
    - install
    - lint
    - test
    - build

# - - - INSTALL - - -
install-dependencies:
    stage: install
    script:
        - echo "Installing dependencies..."
        - apt-get update && apt-get install -y gettext docker-compose
        - envsubst < .env.template > .env.local
        - npm ci
    cache:
        paths:
            - node_modules/
    artifacts:
        expire_in: 1 days
        when: on_success
        paths:
            - node_modules/
            - .env.local

# - - - TEST - - -
test-unit:
    stage: test
    script:
        - echo "Running unit tests..."
        - npm run test:unit
    rules:
        - if: $CI_COMMIT_BRANCH =~ /feature\/.*/
        - if: $CI_COMMIT_BRANCH == "main"

test-integration:
    stage: test
    services:
        - docker:dind  # Enables running Docker inside GitLab CI
    variables:
        DOCKER_TLS_CERTDIR: ""  # Required to allow Docker in Docker
    script:
        - echo "Installing Docker CLI..."
        - apt-get update && apt-get install -y docker.io
        - echo "Starting PostgreSQL with Docker Compose..."
        - docker compose up -d
        - echo "Waiting for PostgreSQL to be ready..."
        - until docker exec $(docker ps -qf "name=postgres") pg_isready -U $POSTGRES_USER; do sleep 2; done
        - echo "Applying database schema with Drizzle..."
        - npx drizzle-kit push
        - echo "Running integration tests..."
        - npm run test:integration
        - echo "Stopping PostgreSQL..."
        - docker compose down
    rules:
        - if: $CI_COMMIT_BRANCH =~ /feature\/.*/
        - if: $CI_COMMIT_BRANCH == "main"

# - - - BUILD - - -
build:
    stage: build
    script:
        - echo "Building the project..."
        - npm run build
    rules:
        - if: $CI_COMMIT_BRANCH == "main"
