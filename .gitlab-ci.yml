image: docker:latest  # Use Docker as the base image

stages:
    - install
    - test
    - build

# - - - INSTALL - - -
install-dependencies:
    stage: install
    services:
        - docker:dind  # Enable Docker-in-Docker
    variables:
        DOCKER_TLS_CERTDIR: ""  # Required for dind
    script:
        - echo "Installing dependencies..."
        - envsubst < .env.template > .env.local
        - npm ci
    cache:
        paths:
            - node_modules/
    artifacts:
        expire_in: 1 days
        when: on_success
        paths:
            - node_modules/
            - .env.local

# - - - TEST - - -
test-unit:
    stage: test
    needs:
        - install-dependencies
    script:
        - echo "Running unit tests..."
        - npm run test:unit
    rules:
        - if: $CI_COMMIT_BRANCH =~ /feature\/.*/
        - if: $CI_COMMIT_BRANCH == "main"

test-integration:
    stage: test
    needs:
        - install-dependencies
    services:
        - docker:dind  # Run PostgreSQL via Docker Compose inside GitLab CI/CD
    variables:
        DOCKER_TLS_CERTDIR: ""  # Required for Docker-in-Docker
    before_script:
        - echo "Checking if Docker Compose is installed..."
        - if ! docker compose version; then
            echo "Installing Docker Compose...";
            curl -L "https://github.com/docker/compose/releases/latest/download/docker-compose-linux-x86_64" -o /usr/local/bin/docker-compose;
            chmod +x /usr/local/bin/docker-compose;
            ln -s /usr/local/bin/docker-compose /usr/bin/docker-compose;
          fi

        - echo "Starting PostgreSQL using Docker Compose..."
        - docker compose --env-file .env.local up -d

        - echo "Waiting for PostgreSQL to be ready..."
        - until docker exec $(docker ps -qf "name=postgres") pg_isready -U $DB_USER -h $DB_HOSTNAME -p $DB_PORT; do
            echo "PostgreSQL not ready yet...";
            sleep 2;
          done
        - echo "PostgreSQL is ready!"

        - echo "Applying database schema with Drizzle..."
        - npx drizzle-kit push

    script:
        - echo "Running integration tests..."
        - npm run test:integration

    after_script:
        - echo "Stopping PostgreSQL..."
        - docker compose down  # Using Docker CLI

    rules:
        - if: $CI_COMMIT_BRANCH =~ /feature\/.*/
        - if: $CI_COMMIT_BRANCH == "main"

# - - - BUILD - - -
build:
    stage: build
    needs:
        - test-integration
    script:
        - echo "Building the project..."
        - npm run build
    rules:
        - if: $CI_COMMIT_BRANCH == "main"
